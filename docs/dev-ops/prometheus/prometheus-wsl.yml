global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # IDEA runs the application on the Windows host.
  - job_name: group-buy-market-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8091"]
        labels:
          app: group-buy-market-app
